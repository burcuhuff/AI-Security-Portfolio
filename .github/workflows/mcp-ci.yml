#ai-security-portfolio/.github/workflows/mcp-ci.yml
name: MCP CI

on:
  push:
    branches: [main]
    paths:
      - "secure-enterprise-mcp/**"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "secure-enterprise-mcp/**"
      - ".github/workflows/mcp-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: secure-enterprise-mcp

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build container image
        run: docker build -t secure-enterprise-mcp:local .

      - name: Verify container authorization behavior
        run: python scripts/container_smoke.py